name: Deploy

# Rebuilds on every push and every 6 hours. Each build re-reads Apple's catalogue and
# the YouTube feeds, so new releases and new videos appear without a commit.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run assets:check
      - run: npm run check
      - run: npm run check:page-load
      - run: npm run check:focus
      - run: npm run check:modes
      - run: npm run check:type-units
      - run: npm run test:gates
      - run: npm run build
      # The build re-reads Apple and YouTube, so a title or description from live feed data can trip a hard html-validate
      # rule. On the 6-hourly rebuild that must not stop the site updating: the failure is shown as a warning annotation and
      # the run goes on. A push or a manual dispatch is a human at the keyboard, so there it still blocks. Everything else
      # (check:csp included) stays blocking on every trigger; test:gates runs on fixtures only and never touches feed data.
      - id: html
        run: npm run check:html
        continue-on-error: ${{ github.event_name == 'schedule' }}
      - if: github.event_name == 'schedule' && steps.html.outcome == 'failure'
        run: 'echo "::warning title=html check failed on the scheduled rebuild::A hard html-validate error in the built pages, likely from live feed data. This run carried on to deploy; the other gates still blocked it. Run npm run build then npm run check:html to see the error."'
      - run: npm run check:csp
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
